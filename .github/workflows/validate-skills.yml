
name: Validate Agent Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate skills and issue templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YAML parser
        run: pip install PyYAML

      - name: Validate skill files
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          skill_files = sorted(Path("skills").glob("*/SKILL.md"))
          errors = []

          if not skill_files:
              errors.append("No skills/*/SKILL.md files found.")

          for file in skill_files:
              lines = file.read_text(encoding="utf-8").splitlines()
              folder_name = file.parent.name

              if not lines or lines[0].strip() != "---":
                  errors.append(f"{file}: Missing opening frontmatter.")
                  continue

              try:
                  end = next(
                      i for i in range(1, len(lines))
                      if lines[i].strip() == "---"
                  )
              except StopIteration:
                  errors.append(f"{file}: Missing closing frontmatter.")
                  continue

              fields = {}
              for line in lines[1:end]:
                  if ":" in line and not line.startswith((" ", "\t")):
                      key, value = line.split(":", 1)
                      fields[key.strip()] = value.strip().strip('"').strip("'")

              if not fields.get("name"):
                  errors.append(f"{file}: Missing name.")

              if not fields.get("description"):
                  errors.append(f"{file}: Missing description.")

              if fields.get("name") != folder_name:
                  errors.append(f"{file}: Name does not match folder.")

              if not "\n".join(lines[end + 1:]).strip():
                  errors.append(f"{file}: Empty instructions.")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print(f"Validated {len(skill_files)} skill files.")
          PY

      - name: Validate issue templates
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          import sys

          template_dir = Path(".github/ISSUE_TEMPLATE")
          templates = sorted(template_dir.glob("*.yml"))
          errors = []

          if not templates:
              errors.append("No issue templates found.")

          for file in templates:
              try:
                  data = yaml.safe_load(file.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  errors.append(f"{file}: Invalid YAML: {exc}")
                  continue

              if not isinstance(data, dict):
                  errors.append(f"{file}: Template must be a YAML object.")
                  continue

              for field in ("name", "description", "body"):
                  if not data.get(field):
                      errors.append(f"{file}: Missing {field}.")

              body = data.get("body", [])
              if not isinstance(body, list):
                  errors.append(f"{file}: body must be a list.")
                  continue

              ids = []
              for item in body:
                  if not isinstance(item, dict):
                      errors.append(f"{file}: Invalid body item.")
                      continue

                  if item.get("type") != "markdown":
                      item_id = item.get("id")
                      if not item_id:
                          errors.append(f"{file}: Form field missing id.")
                      else:
                          ids.append(item_id)

              if len(ids) != len(set(ids)):
                  errors.append(f"{file}: Duplicate field IDs.")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print(f"Validated {len(templates)} issue templates.")
          PY
